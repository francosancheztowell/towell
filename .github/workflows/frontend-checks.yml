name: Frontend checks

# CI del refactor 2026 (fase 10). El nombre del archivo se conserva porque el
# .gitignore solo deja versionar este workflow.
#
# - checks: tipos, tests de JS, build y ratchet de deuda (ningun conteo sube).
# - php:    php artisan test en sqlite (phpunit.xml; el grupo sqlserver se corre a
#           mano, ver tests/README-sqlserver.md), phpstan con baseline, y sobre los
#           PHP que cambian: Pint (el repo no esta formateado entero) y PHPMD (solo
#           violaciones nuevas); composer audit bloquea si composer.lock trae
#           advisories nuevos (fase 22, scripts/calidad.mjs).

on:
  pull_request:
  push:
    # claude/**: las sesiones no abren PR; asi su rama tambien tiene CI.
    branches: [main, 'claude/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Tests JS
        run: npm run test:js

      - name: Build
        run: npm run build

      - name: Ratchet de deuda
        run: npm run ratchet

  php:
    runs-on: ubuntu-latest
    env:
      CAMBIADOS_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          coverage: none

      - name: Cache de composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # bootstrap/cache y storage/framework/* estan ignorados: no vienen en el checkout.
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Las vistas que usan @vite necesitan public/build/manifest.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Tests PHP
        run: php artisan test

      - name: PHPStan (baseline)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      # Pint, PHPMD y composer audit comparan contra la misma base (scripts/calidad.mjs):
      # PR, su rama base; push, lo que trae el push (rama nueva o force-push: el ultimo commit).
      - name: Pint (solo archivos cambiados)
        run: node scripts/calidad.mjs pint

      # Sin baseline: falla solo por violaciones nuevas respecto a la version base de cada
      # PHP cambiado (umbrales en phpmd.xml, criterio en .planning/phases/22-calidad/22-01-PLAN.md).
      - name: PHPMD (solo archivos cambiados)
        run: node scripts/calidad.mjs phpmd

      # Bloquea solo advisories nuevos cuando el cambio toca composer.lock; si no, aviso.
      - name: composer audit
        run: node scripts/calidad.mjs audit
