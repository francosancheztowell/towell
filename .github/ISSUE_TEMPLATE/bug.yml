name: Reporte de error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options: [Planeación, Programa Urd-Eng, Urdido, Engomado, Tejido, Atadores, Tejedores, Mantenimiento / Mecánicos, Crudo, Producto terminado, Trazabilidad, Ventas, Configuración, Otro]
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Ir a…\n2. Clic en…\n3. Ver el error"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: input
    id: referencia
    attributes:
      label: Código de referencia del error
      description: El que muestra la página de error, o el folio / orden / telar involucrado
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o video
