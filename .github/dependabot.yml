# ponytail: mensual y agrupado para no inundar de PRs; composer respeta config.platform.php (8.2)
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: monthly }
    groups:
      composer: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
